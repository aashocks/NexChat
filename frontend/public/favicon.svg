<svg xmlns="http://www.w3.org/2000/svg" viewBox="278 152 860 860" width="512" height="512" role="img" aria-label="NexChat logo">
  <defs>
    <linearGradient id="body" x1="330" y1="200" x2="1100" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FD8FF"/>
      <stop offset="0.35" stop-color="#1E86FF"/>
      <stop offset="0.7" stop-color="#7A3CFF"/>
      <stop offset="1" stop-color="#6A12FF"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="400" cy="840" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="1105" cy="560" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4DFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF4DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillar" x1="900" y1="200" x2="1040" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FC3FF"/>
      <stop offset="0.35" stop-color="#8E86FF"/>
      <stop offset="0.7" stop-color="#4A2CFF"/>
      <stop offset="1" stop-color="#2A0FC8"/>
    </linearGradient>
    <radialGradient id="pillarTop" cx="1090" cy="250" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E08CFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E08CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inner" x1="420" y1="380" x2="420" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1FB8"/>
      <stop offset="0.45" stop-color="#0057F5"/>
      <stop offset="1" stop-color="#00C8FF"/>
    </linearGradient>
  </defs>

  <!-- Main speech-bubble body -->
  <path id="body-shape" d="M303 390 C303 280 390 190 500 190 C550 190 598 210 630 240 L965 555 C985 573 1003 580 1020 580 C1070 580 1100 520 1113 450 L1113 670 C1113 770 1030 847 930 847 L660 847 L437 972 Q428 975 429 965 L468 852 C375 845 303 770 303 670 Z"
        fill="url(#body)" stroke="#1B3FD6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M303 390 C303 280 390 190 500 190 C550 190 598 210 630 240 L965 555 C985 573 1003 580 1020 580 C1070 580 1100 520 1113 450 L1113 670 C1113 770 1030 847 930 847 L660 847 L437 972 Q428 975 429 965 L468 852 C375 845 303 770 303 670 Z"
        fill="url(#cyanGlow)"/>
  <path d="M303 390 C303 280 390 190 500 190 C550 190 598 210 630 240 L965 555 C985 573 1003 580 1020 580 C1070 580 1100 520 1113 450 L1113 670 C1113 770 1030 847 930 847 L660 847 L437 972 Q428 975 429 965 L468 852 C375 845 303 770 303 670 Z"
        fill="url(#pinkGlow)"/>

  <!-- Right pillar of the "N" -->
  <path d="M882 222 Q882 192 930 192 C1030 192 1113 280 1113 390 L1113 450 C1100 520 1070 580 1020 580 C995 580 975 565 965 555 L882 475 Z"
        fill="url(#pillar)" stroke="#5B1FE0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M882 222 Q882 192 930 192 C1030 192 1113 280 1113 390 L1113 450 C1100 520 1070 580 1020 580 C995 580 975 565 965 555 L882 475 Z"
        fill="url(#pillarTop)"/>

  <!-- Inner blue counter on the left -->
  <path d="M307 670 C310 540 340 410 410 385 C455 372 495 385 520 410 L537 428 L537 833 L520 845 C400 840 307 770 307 670 Z"
        fill="url(#inner)"/>

  <!-- Dark message pill -->
  <path d="M537 428 L680 558 C700 575 720 580 745 580 L850 580 C900 580 937 622 937 670 C937 718 900 762 850 762 L685 762 C665 762 650 768 640 774 L537 833 Z"
        fill="#050A1F"/>

  <!-- Typing dots -->
  <circle cx="637" cy="670" r="35" fill="#F7F7FF"/>
  <circle cx="743" cy="670" r="35" fill="#F7F7FF"/>
  <circle cx="847" cy="670" r="35" fill="#F7F7FF"/>
</svg>
